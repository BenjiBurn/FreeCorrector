<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FreeCorrector</title>
  <link rel="stylesheet" href="../lib/common.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon.svg" alt="" width="28" height="28">
    <div>
      <h1>FreeCorrector</h1>
      <p class="muted" data-i18n="popupTagline">Français et anglais · 100 % local</p>
    </div>
  </header>

  <!-- Shown once the user has applied many fixes (popup.js). -->
  <div class="review" id="review" hidden>
    <button type="button" class="review-close" id="review-close" data-i18n-aria-label="reviewClose" aria-label="Fermer">×</button>
    <strong><span class="stars" aria-hidden="true">★★★★★</span> <span data-i18n="reviewTitle">FreeCorrector vous rend service ?</span></strong>
    <span data-i18n="reviewText">Un avis sur le store aide d’autres personnes à le découvrir.</span>
    <div class="review-actions">
      <button type="button" class="link" id="review-leave" data-i18n="reviewLeave">Laisser un avis</button>
      <button type="button" class="link later" id="review-later" data-i18n="reviewLater">Plus tard</button>
    </div>
  </div>

  <label class="row">
    <span data-i18n="popupEnabled">Correction activée</span>
    <input type="checkbox" id="enabled" class="switch">
  </label>

  <label class="row" id="site-row">
    <span><span data-i18n="popupSiteEnabled">Activé sur</span> <strong id="site"></strong></span>
    <input type="checkbox" id="site-enabled" class="switch">
  </label>

  <label class="row" id="picky-row">
    <span>
      <span data-i18n="optPicky">Mode exigeant</span>
      <small class="hint muted" data-i18n="popupPickyHint">Typographie fine, « ne » oubliés, répétitions</small>
    </span>
    <input type="checkbox" id="picky" class="switch">
  </label>

  <button type="button" id="open-editor" class="primary-action" data-i18n="popupOpenEditor">Ouvrir le correcteur</button>

  <footer>
    <button type="button" id="open-options" class="link" data-i18n="popupOptions">Options et dictionnaire</button>
    <button type="button" id="open-demo" class="link" hidden data-i18n="popupDemo">Page de test</button>
    <p class="credit muted" data-i18n="credit">Créé par BenjiBurn</p>
  </footer>

  <script src="../lib/settings.js"></script>
  <script src="../lib/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
