<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>FreeCorrector</title>
  <link rel="stylesheet" href="../lib/common.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon.svg" alt="" width="28" height="28">
    <div>
      <h1>FreeCorrector</h1>
      <p class="muted">Français · 100 % local</p>
    </div>
  </header>

  <label class="row">
    <span>Correction activée</span>
    <input type="checkbox" id="enabled" class="switch">
  </label>

  <label class="row" id="site-row">
    <span>Activé sur <strong id="site"></strong></span>
    <input type="checkbox" id="site-enabled" class="switch">
  </label>

  <footer>
    <button type="button" id="open-options" class="link">Options et dictionnaire</button>
    <button type="button" id="open-demo" class="link">Page de test</button>
    <p class="credit muted">Créé par BenjiBurn</p>
  </footer>

  <script src="../lib/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
